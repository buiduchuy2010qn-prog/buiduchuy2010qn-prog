<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="160" viewBox="0 0 1200 160" fill="none" role="img" aria-labelledby="pillarsLightTitle pillarsLightDesc">
  <title id="pillarsLightTitle">Core Engineering Pillars (Light Theme)</title>
  <desc id="pillarsLightDesc">Four open-source engineering focus cards in Pure Horizon Light style: Systems and Rust, Minecraft Ecosystem, Android Native, and Desktop and Web.</desc>
  <defs>
    <linearGradient id="cardBgL" x1="0" y1="0" x2="288" y2="148" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#F4F8FF"/>
    </linearGradient>
    <linearGradient id="topCyanL" x1="0" y1="0" x2="288" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0284C7"/>
      <stop offset="1" stop-color="#38BDF8" stop-opacity="0.35"/>
    </linearGradient>
    <linearGradient id="topEmeraldL" x1="0" y1="0" x2="288" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#059669"/>
      <stop offset="1" stop-color="#34D399" stop-opacity="0.35"/>
    </linearGradient>
    <linearGradient id="topVioletL" x1="0" y1="0" x2="288" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#7C3AED"/>
      <stop offset="1" stop-color="#A78BFA" stop-opacity="0.35"/>
    </linearGradient>
    <linearGradient id="topSkyL" x1="0" y1="0" x2="288" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0369A1"/>
      <stop offset="1" stop-color="#6366F1" stop-opacity="0.35"/>
    </linearGradient>
  </defs>

  <!-- Card 1: Systems & Rust -->
  <g transform="translate(0 6)">
    <rect width="288" height="148" rx="16" fill="url(#cardBgL)" stroke="#BAE6FD" stroke-width="1.3"/>
    <path d="M16 1H272" stroke="url(#topCyanL)" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="252" cy="36" r="16" fill="#E0F2FE" stroke="#7DD3FC"/>
    <path d="M252 25L261 30.5V41.5L252 47L243 41.5V30.5Z" stroke="#0284C7" stroke-width="1.8"/>
    <circle cx="252" cy="36" r="3" fill="#0284C7"/>
    <text x="20" y="34" fill="#0284C7" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="1.4">01 · SYSTEMS &amp; RUST</text>
    <text x="20" y="64" fill="#0F172A" font-family="Segoe UI, Arial, sans-serif" font-size="18.5" font-weight="800">Low-Level Core</text>
    <text x="20" y="96" fill="#475569" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="500">Ultra-light engines, Win32 API</text>
    <text x="20" y="117" fill="#475569" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="500">&amp; memory optimization</text>
  </g>

  <!-- Card 2: Minecraft -->
  <g transform="translate(304 6)">
    <rect width="288" height="148" rx="16" fill="url(#cardBgL)" stroke="#A7F3D0" stroke-width="1.3"/>
    <path d="M16 1H272" stroke="url(#topEmeraldL)" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="252" cy="36" r="16" fill="#D1FAE5" stroke="#6EE7B7"/>
    <path d="M252 25L261 30V41L252 46L243 41V30L252 25ZM243 30L252 35L261 30M252 35V46" stroke="#059669" stroke-width="1.6"/>
    <text x="20" y="34" fill="#059669" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="1.4">02 · MINECRAFT</text>
    <text x="20" y="64" fill="#0F172A" font-family="Segoe UI, Arial, sans-serif" font-size="18.5" font-weight="800">Ecosystem Suite</text>
    <text x="20" y="96" fill="#475569" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="500">Multi-loader launchers, ARM64</text>
    <text x="20" y="117" fill="#475569" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="500">servers &amp; Rust cores</text>
  </g>

  <!-- Card 3: Android Native -->
  <g transform="translate(608 6)">
    <rect width="288" height="148" rx="16" fill="url(#cardBgL)" stroke="#DDD6FE" stroke-width="1.3"/>
    <path d="M16 1H272" stroke="url(#topVioletL)" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="252" cy="36" r="16" fill="#EDE9FE" stroke="#C4B5FD"/>
    <rect x="245" y="26" width="14" height="20" rx="3" stroke="#7C3AED" stroke-width="1.6"/>
    <line x1="250" y1="42" x2="254" y2="42" stroke="#7C3AED" stroke-width="1.6" stroke-linecap="round"/>
    <text x="20" y="34" fill="#7C3AED" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="1.4">03 · ANDROID NATIVE</text>
    <text x="20" y="64" fill="#0F172A" font-family="Segoe UI, Arial, sans-serif" font-size="18.5" font-weight="800">Mobile Craft</text>
    <text x="20" y="96" fill="#475569" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="500">Kotlin, Jetpack Compose,</text>
    <text x="20" y="117" fill="#475569" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="500">CameraX &amp; 120Hz glass UI</text>
  </g>

  <!-- Card 4: Desktop & Web -->
  <g transform="translate(912 6)">
    <rect width="288" height="148" rx="16" fill="url(#cardBgL)" stroke="#CBD5E1" stroke-width="1.3"/>
    <path d="M16 1H272" stroke="url(#topSkyL)" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="252" cy="36" r="16" fill="#E0F2FE" stroke="#93C5FD"/>
    <rect x="242" y="27" width="20" height="14" rx="2.5" stroke="#0369A1" stroke-width="1.6"/>
    <path d="M247 45H257" stroke="#0369A1" stroke-width="1.6" stroke-linecap="round"/>
    <text x="20" y="34" fill="#0369A1" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="1.4">04 · DESKTOP &amp; WEB</text>
    <text x="20" y="64" fill="#0F172A" font-family="Segoe UI, Arial, sans-serif" font-size="18.5" font-weight="800">App &amp; Delivery</text>
    <text x="20" y="96" fill="#475569" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="500">Electron, C# .NET, React 19</text>
    <text x="20" y="117" fill="#475569" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="500">&amp; automated CI/OTA</text>
  </g>
</svg>
