<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="160" viewBox="0 0 1200 160" fill="none" role="img" aria-labelledby="pillarsDarkTitle pillarsDarkDesc">
  <title id="pillarsDarkTitle">Core Engineering Pillars (Dark Theme)</title>
  <desc id="pillarsDarkDesc">Four open-source engineering focus cards: Systems and Rust, Minecraft Ecosystem, Android Native, and Desktop and Web.</desc>
  <defs>
    <linearGradient id="cardBgD" x1="0" y1="0" x2="288" y2="148" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0E1729"/>
      <stop offset="1" stop-color="#131B33"/>
    </linearGradient>
    <linearGradient id="topCyanD" x1="0" y1="0" x2="288" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#22D3EE"/>
      <stop offset="1" stop-color="#0EA5E9" stop-opacity="0.25"/>
    </linearGradient>
    <linearGradient id="topEmeraldD" x1="0" y1="0" x2="288" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#34D399"/>
      <stop offset="1" stop-color="#10B981" stop-opacity="0.25"/>
    </linearGradient>
    <linearGradient id="topVioletD" x1="0" y1="0" x2="288" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#A78BFA"/>
      <stop offset="1" stop-color="#8B5CF6" stop-opacity="0.25"/>
    </linearGradient>
    <linearGradient id="topSkyD" x1="0" y1="0" x2="288" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#38BDF8"/>
      <stop offset="1" stop-color="#6366F1" stop-opacity="0.25"/>
    </linearGradient>
  </defs>

  <!-- Card 1: Systems & Rust -->
  <g transform="translate(0 6)">
    <rect width="288" height="148" rx="16" fill="url(#cardBgD)" stroke="#22D3EE" stroke-opacity="0.30" stroke-width="1.2"/>
    <path d="M16 1H272" stroke="url(#topCyanD)" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="252" cy="36" r="16" fill="#06B6D4" fill-opacity="0.12" stroke="#22D3EE" stroke-opacity="0.35"/>
    <path d="M252 25L261 30.5V41.5L252 47L243 41.5V30.5Z" stroke="#22D3EE" stroke-width="1.8"/>
    <circle cx="252" cy="36" r="3" fill="#67E8F9"/>
    <text x="20" y="34" fill="#22D3EE" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="1.4">01 · SYSTEMS &amp; RUST</text>
    <text x="20" y="64" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="18.5" font-weight="800">Low-Level Core</text>
    <text x="20" y="96" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="500">Ultra-light engines, Win32 API</text>
    <text x="20" y="117" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="500">&amp; memory optimization</text>
  </g>

  <!-- Card 2: Minecraft -->
  <g transform="translate(304 6)">
    <rect width="288" height="148" rx="16" fill="url(#cardBgD)" stroke="#34D399" stroke-opacity="0.30" stroke-width="1.2"/>
    <path d="M16 1H272" stroke="url(#topEmeraldD)" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="252" cy="36" r="16" fill="#10B981" fill-opacity="0.12" stroke="#34D399" stroke-opacity="0.35"/>
    <path d="M252 25L261 30V41L252 46L243 41V30L252 25ZM243 30L252 35L261 30M252 35V46" stroke="#34D399" stroke-width="1.6"/>
    <text x="20" y="34" fill="#34D399" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="1.4">02 · MINECRAFT</text>
    <text x="20" y="64" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="18.5" font-weight="800">Ecosystem Suite</text>
    <text x="20" y="96" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="500">Multi-loader launchers, ARM64</text>
    <text x="20" y="117" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="500">servers &amp; Rust cores</text>
  </g>

  <!-- Card 3: Android Native -->
  <g transform="translate(608 6)">
    <rect width="288" height="148" rx="16" fill="url(#cardBgD)" stroke="#A78BFA" stroke-opacity="0.30" stroke-width="1.2"/>
    <path d="M16 1H272" stroke="url(#topVioletD)" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="252" cy="36" r="16" fill="#8B5CF6" fill-opacity="0.12" stroke="#A78BFA" stroke-opacity="0.35"/>
    <rect x="245" y="26" width="14" height="20" rx="3" stroke="#A78BFA" stroke-width="1.6"/>
    <line x1="250" y1="42" x2="254" y2="42" stroke="#A78BFA" stroke-width="1.6" stroke-linecap="round"/>
    <text x="20" y="34" fill="#A78BFA" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="1.4">03 · ANDROID NATIVE</text>
    <text x="20" y="64" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="18.5" font-weight="800">Mobile Craft</text>
    <text x="20" y="96" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="500">Kotlin, Jetpack Compose,</text>
    <text x="20" y="117" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="500">CameraX &amp; 120Hz glass UI</text>
  </g>

  <!-- Card 4: Desktop & Web -->
  <g transform="translate(912 6)">
    <rect width="288" height="148" rx="16" fill="url(#cardBgD)" stroke="#38BDF8" stroke-opacity="0.30" stroke-width="1.2"/>
    <path d="M16 1H272" stroke="url(#topSkyD)" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="252" cy="36" r="16" fill="#0284C7" fill-opacity="0.14" stroke="#38BDF8" stroke-opacity="0.35"/>
    <rect x="242" y="27" width="20" height="14" rx="2.5" stroke="#38BDF8" stroke-width="1.6"/>
    <path d="M247 45H257" stroke="#38BDF8" stroke-width="1.6" stroke-linecap="round"/>
    <text x="20" y="34" fill="#38BDF8" font-family="Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="1.4">04 · DESKTOP &amp; WEB</text>
    <text x="20" y="64" fill="#F8FAFC" font-family="Segoe UI, Arial, sans-serif" font-size="18.5" font-weight="800">App &amp; Delivery</text>
    <text x="20" y="96" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="500">Electron, C# .NET, React 19</text>
    <text x="20" y="117" fill="#94A3B8" font-family="Segoe UI, Arial, sans-serif" font-size="13.5" font-weight="500">&amp; automated CI/OTA</text>
  </g>
</svg>
